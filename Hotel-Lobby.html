<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="true">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Bodoni+Moda:ital,wght@0,400..900;1,400..900&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  html,body{ margin:0; padding:0; background:#F5F0E6; color:#2E3F52; font-family:'Work Sans',sans-serif; -webkit-font-smoothing:antialiased; }
  *{ box-sizing:border-box; }
  a{ color:#DBA0A0; }
  a:hover{ color:#DBA0A0; }
</style>
</helmet>

<div style="background:#2E3F52; color:#F5F0E6;">
  <header style="max-width:900px; margin:0 auto; padding:26px 28px; display:flex; align-items:center; justify-content:space-between;">
    <a href="Panee Portfolio.dc.html" style="font-family:'Archivo Black',sans-serif; font-size:14px; color:#B9CBDA;" style-hover="color:#F5F0E6;">← Panee Youngprasit</a>
    <a href="mailto:paneeyoung@gmail.com" style="background:#DBA0A0; color:#2E3F52; font-size:13.5px; font-weight:600; padding:9px 18px; border-radius:999px;" style-hover="background:#DBA0A0;">Contact</a>
  </header>
  <div style="max-width:900px; margin:0 auto; padding:24px 28px 64px;">
    <p style="font-family:'Bodoni Moda',serif; font-style:italic; font-size:20px; color:#DBA0A0; margin:0 0 8px;">Interior · Hospitality</p>
    <h1 style="font-family:'Archivo Black',sans-serif; font-size:clamp(38px,6vw,64px); line-height:1.05; margin:0 0 20px;">Hotel Lobby</h1>
    <p style="font-size:17px; line-height:1.6; color:#B9CBDA; max-width:60ch; margin:0 0 30px;">A warm, plant-lined lobby lounge with a house-frame feature, rattan seating, and glazed views of the garden.</p>
  </div>
</div>

<div style="max-width:900px; margin:0 auto; padding:64px 28px;">
  <div style="display:grid; grid-template-columns:1fr; gap:20px; margin-bottom:64px;">
    <img src="assets/hotel-lobby-1.jpg" alt="Hotel lobby lounge with rattan chairs and house-frame window feature" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
  </div>

  <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:64px;">
    <img src="assets/hotel-lobby-14.jpg" alt="Kokotel lounge with illuminated house-frame feature at night" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
    <img src="assets/hotel-lobby-15.jpg" alt="Kokotel rattan flower chairs and daybed by mural wall" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
    <img src="assets/hotel-lobby-16.jpg" alt="Kokotel lobby corridor with rattan seating" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
    <img src="assets/hotel-lobby-17.jpg" alt="Kokotel lounge seating with house-frame lighting feature" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
    <img src="assets/hotel-lobby-18.jpg" alt="Dining area with industrial pendant lighting" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
    <img src="assets/hotel-lobby-19.jpg" alt="Kokotel rattan chairs and daybed against brick wall" onClick="{{ openLightbox }}" style="width: 326px; display: block; border-radius: 4px; height: 183px; cursor:zoom-in;">
  </div>

  <p style="font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:#8C8478; margin:0 0 20px;">Reference</p>
  <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:64px;">
    <img src="assets/hotel-lobby-ref-1.jpg" alt="Rattan coffee table with books and elephant figurine reference" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
    <img src="assets/hotel-lobby-ref-2.jpg" alt="Wall sconce lighting with woven pattern wall reference" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
    <img src="assets/hotel-lobby-ref-3.jpg" alt="Weathered brick wall texture reference" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
    <img src="assets/hotel-lobby-ref-4.jpg" alt="Woven wall baskets and patterned pillows reference" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
  </div>

  <p style="font-size:13px; color:#8C8478; border-top:1px dashed #E8E0CF; padding-top:20px;">Personal styling projects.</p>
</div>

<div style="max-width:1100px; margin:0 auto; padding:0 28px 64px;">
  <p style="font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:#8C8478; margin:0 0 20px;">Concept &amp; details</p>
  <div style="display:grid; grid-template-columns:1fr; gap:32px;">
    <img src="assets/hotel-lobby-concept-1.jpg" alt="Kokotel Chiangmai Nimman project overview with construction drawings" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
    <img src="assets/hotel-lobby-concept-2.jpg" alt="Traditional gimmick concept with built-in lounge seat construction drawings" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
  </div>

  <p style="font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:#8C8478; margin:32px 0 20px;">Construction drawings</p>
  <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:24px;">
    <img src="assets/hotel-lobby-cd-1.jpg" alt="Built-in lounge seat plan drawing" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
    <img src="assets/hotel-lobby-cd-2.jpg" alt="Elevation A-A, B-B, C-C drawings" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
    <img src="assets/hotel-lobby-cd-3.jpg" alt="Elevation K-K drawings" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
    <img src="assets/hotel-lobby-cd-4.jpg" alt="Built-in lounge seat elevation detail" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
    <img src="assets/hotel-lobby-cd-5.jpg" alt="Elevation J-J drawings" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
    <img src="assets/hotel-lobby-cd-6.jpg" alt="Detail photoshoot wall and kids' room entrance elevation" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
    <img src="assets/hotel-lobby-cd-7.jpg" alt="Built-in lounge seat plan and detail drawings" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
    <img src="assets/hotel-lobby-cd-8.jpg" alt="Built-in lounge seat elevation 3 drawing" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
    <img src="assets/hotel-lobby-cd-9.jpg" alt="Typical embossed wall detail elevation drawing" onClick="{{ openLightbox }}" style="width:100%; display:block; border-radius:4px; cursor:zoom-in;">
  </div>
</div>

<div style="background:#2E3F52; color:#B9CBDA; text-align:center; padding:40px 28px;">
  <a href="Panee Portfolio.dc.html" style="color:#DBA0A0; font-size:14px;">← Back to all work</a>
</div>

<sc-if value="{{ lightboxSrc }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ closeLightbox }}" style="position:fixed; inset:0; background:rgba(30,38,48,0.92); display:flex; align-items:center; justify-content:center; z-index:1000; padding:40px; cursor:zoom-out;">
    <img src="{{ lightboxSrc }}" alt="Enlarged view" style="max-width:100%; max-height:100%; object-fit:contain; border-radius:4px; box-shadow:0 20px 60px rgba(0,0,0,0.5);">
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lightboxSrc: null };
  renderVals() {
    return {
      lightboxSrc: this.state.lightboxSrc,
      openLightbox: (e) => this.setState({ lightboxSrc: e.currentTarget.src }),
      closeLightbox: () => this.setState({ lightboxSrc: null }),
    };
  }
}
</script>
</body>
</html>
